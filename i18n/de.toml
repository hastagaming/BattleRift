# BattleRift language pack. Plain data only. Keep every {placeholder} exactly as in en.toml.
[meta]
format = 1
code = "de"
name = "Deutsch"
name_en = "German"
version = 1
direction = "ltr"
plural_rule = "one_other"
decimal_separator = ","
group_separator = "."
date_order = "dmy"
date_separator = "."
fallback = "en"

