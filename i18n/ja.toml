# BattleRift language pack. Plain data only. Keep every {placeholder} exactly as in en.toml.
[meta]
format = 1
code = "ja"
name = "日本語"
name_en = "Japanese"
version = 1
direction = "ltr"
plural_rule = "none"
decimal_separator = "."
group_separator = ","
date_order = "ymd"
date_separator = "/"
fallback = "en"

