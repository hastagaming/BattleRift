# BattleRift language pack. Plain data only. Keep every {placeholder} exactly as in en.toml.
[meta]
format = 1
code = "en"
name = "English"
name_en = "English"
version = 1
direction = "ltr"
plural_rule = "one_other"
decimal_separator = "."
group_separator = ","
date_order = "mdy"
date_separator = "/"
fallback = "en"

