# BattleRift language pack. Plain data only. Keep every {placeholder} exactly as in en.toml.
[meta]
format = 1
code = "ms"
name = "Bahasa Melayu"
name_en = "Malay"
version = 1
direction = "ltr"
plural_rule = "none"
decimal_separator = "."
group_separator = ","
date_order = "dmy"
date_separator = "/"
fallback = "en"

