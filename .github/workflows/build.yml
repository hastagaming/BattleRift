name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      variant:
        description: "release, or debug (debug shows the Developer account and Dev Match for LAN tests)"
        default: "release"
        type: choice
        options:
          - release
          - debug

env:
  GODOT_VERSION: "4.3"
  # Android API levels. The export preset must carry the same min and target SDK (checked below).
  ANDROID_MIN_SDK: "26"
  ANDROID_COMPILE_SDK: "36"
  ANDROID_TARGET_SDK: "36"
  ANDROID_BUILD_TOOLS: "36.1.0"
  # Godot 4.3 ships AGP 8.2.0, Gradle 8.2 and compileSdk 34. The template is patched to the
  # combination the official Godot 4.7 template ships for API 36 (see tools/android).
  ANDROID_GRADLE_PLUGIN: "8.6.1"
  ANDROID_GRADLE_VERSION: "8.11.1"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Prepare Android SDK
        run: |
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          TOOLS="$SDK/cmdline-tools"
          if [ ! -e "$TOOLS/latest" ]; then
            FIRST=$(ls -d "$TOOLS"/*/ | head -n1)
            sudo ln -s "${FIRST%/}" "$TOOLS/latest"
          fi
          MISSING=()
          [ -d "$SDK/platforms/android-$ANDROID_COMPILE_SDK" ] || MISSING+=("platforms;android-$ANDROID_COMPILE_SDK")
          [ -d "$SDK/build-tools/$ANDROID_BUILD_TOOLS" ] || MISSING+=("build-tools;$ANDROID_BUILD_TOOLS")
          [ -d "$SDK/ndk/23.2.8568313" ] || MISSING+=("ndk;23.2.8568313")
          [ -d "$SDK/cmake/3.10.2.4988404" ] || MISSING+=("cmake;3.10.2.4988404")
          if [ "${#MISSING[@]}" -gt 0 ]; then
            yes | sudo env "PATH=$PATH" "JAVA_HOME=$JAVA_HOME" "$TOOLS/latest/bin/sdkmanager" "${MISSING[@]}" || true
          fi
          test -d "$SDK/platforms/android-$ANDROID_COMPILE_SDK" || { echo "Android SDK Platform $ANDROID_COMPILE_SDK is missing"; exit 1; }
          test -d "$SDK/build-tools/$ANDROID_BUILD_TOOLS" || { echo "Android build-tools $ANDROID_BUILD_TOOLS are missing"; exit 1; }

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Install Godot and export templates
        run: |
          BASE="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable"
          curl -fsSL -o godot.zip "$BASE/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          curl -fsSL -o templates.tpz "$BASE/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          unzip -q godot.zip
          sudo mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" /usr/local/bin/godot
          TEMPLATE_DIR="$HOME/.local/share/godot/export_templates"
          mkdir -p "$TEMPLATE_DIR"
          unzip -q templates.tpz -d "$TEMPLATE_DIR"
          mv "$TEMPLATE_DIR/templates" "$TEMPLATE_DIR/${GODOT_VERSION}.stable"
          test -f "$TEMPLATE_DIR/${GODOT_VERSION}.stable/android_source.zip"

      - name: Create keystores
        run: |
          keytool -genkeypair -keystore "$HOME/debug.keystore" -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 9999 -storepass android -keypass android -dname "CN=Android Debug,O=Android,C=US"
          keytool -genkeypair -keystore "$RUNNER_TEMP/build.jks" -alias build -keyalg RSA -keysize 2048 -validity 1 -storepass buildpass -keypass buildpass -dname "CN=BattleRift CI"
          echo "GODOT_ANDROID_KEYSTORE_RELEASE_PATH=$RUNNER_TEMP/build.jks" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_RELEASE_USER=build" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD=buildpass" >> "$GITHUB_ENV"

      - name: Configure Godot for Android
        run: |
          mkdir -p "$HOME/.config/godot"
          printf '%s\n' \
            '[gd_resource type="EditorSettings" format=3]' \
            '' \
            '[resource]' \
            "export/android/android_sdk_path = \"$ANDROID_SDK_ROOT\"" \
            "export/android/java_sdk_path = \"$JAVA_HOME\"" \
            "export/android/debug_keystore = \"$HOME/debug.keystore\"" \
            'export/android/debug_keystore_user = "androiddebugkey"' \
            'export/android/debug_keystore_pass = "android"' \
            'export/android/force_system_user = false' \
            'export/android/shutdown_adb_on_exit = false' \
            'export/android/timestamping_authority_url = ""' \
            > "$HOME/.config/godot/editor_settings-${GODOT_VERSION}.tres"

      - name: Run logic tests
        run: |
          godot --headless --import || true
          godot --headless -s res://scripts/tests/logic_tests.gd

      - name: Build and test the notification plugin
        run: |
          gradle --project-dir android-plugin --no-daemon test assembleDebug assembleRelease
          mkdir -p addons/battlerift_notify/bin/debug addons/battlerift_notify/bin/release
          cp android-plugin/battlerift-notify/build/outputs/aar/battlerift-notify-debug.aar addons/battlerift_notify/bin/debug/
          cp android-plugin/battlerift-notify/build/outputs/aar/battlerift-notify-release.aar addons/battlerift_notify/bin/release/
          test -f addons/battlerift_notify/bin/release/battlerift-notify-release.aar

      - name: Install Android build template
        run: |
          rm -rf android
          mkdir -p android/build
          unzip -q -o "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable/android_source.zip" -d android/build
          touch android/build/.gdignore
          printf '%s' "${GODOT_VERSION}.stable" > android/.build_version
          test -f android/build/build.gradle || { echo "build.gradle is missing from the Android template"; exit 1; }
          test -f android/.build_version
          grep -q 'use_gradle_build=true' export_presets.cfg || { echo "export_presets.cfg must contain gradle_build/use_gradle_build=true"; exit 1; }

      - name: Test the Android template patcher
        run: python3 -m unittest discover -s tools/android -p 'test_*.py' -v

      - name: Configure the Android build template for API ${{ env.ANDROID_COMPILE_SDK }}
        run: |
          python3 tools/android/configure_template.py android/build \
            --agp "$ANDROID_GRADLE_PLUGIN" \
            --gradle "$ANDROID_GRADLE_VERSION" \
            --compile-sdk "$ANDROID_COMPILE_SDK" \
            --build-tools "$ANDROID_BUILD_TOOLS"
          grep -q "gradle_build/min_sdk=\"$ANDROID_MIN_SDK\"" export_presets.cfg || { echo "export_presets.cfg gradle_build/min_sdk must be $ANDROID_MIN_SDK"; exit 1; }
          grep -q "gradle_build/target_sdk=\"$ANDROID_TARGET_SDK\"" export_presets.cfg || { echo "export_presets.cfg gradle_build/target_sdk must be $ANDROID_TARGET_SDK"; exit 1; }

      - name: Android diagnostics
        run: |
          echo "Godot: $(godot --version)"
          echo "Java: $(java -version 2>&1 | head -n1)"
          echo "SDK: $ANDROID_SDK_ROOT"
          for dir in platform-tools build-tools platforms cmdline-tools ndk cmake; do
            echo "--- $dir"
            ls "$ANDROID_SDK_ROOT/$dir" 2>&1 | head -n 8
          done
          echo "--- cmdline-tools/latest"
          head -n 3 "$ANDROID_SDK_ROOT/cmdline-tools/latest/source.properties" 2>&1
          echo "--- templates"
          ls "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable" | head -n 40
          echo "--- android template"
          ls android android/build | head -n 30
          echo "build_version: $(cat android/.build_version)"
          echo "--- template toolchain"
          sed -n 1,12p android/build/config.gradle
          grep distributionUrl android/build/gradle/wrapper/gradle-wrapper.properties
          echo "--- preset"
          grep -nE 'use_gradle_build|export_format|min_sdk|target_sdk|unique_name|version/|keystore' export_presets.cfg
          echo "--- editor settings"
          cat "$HOME/.config/godot/editor_settings-${GODOT_VERSION}.tres"
          echo "--- keystore env"
          echo "release keystore: ${GODOT_ANDROID_KEYSTORE_RELEASE_PATH} (exists: $(test -f "$GODOT_ANDROID_KEYSTORE_RELEASE_PATH" && echo yes || echo no))"

      - name: Export APK
        run: |
          set -o pipefail
          mkdir -p build
          godot --headless --verbose --export-${{ inputs.variant || 'release' }} "Android" build/BattleRift.apk 2>&1 | tee export.log
          test -f build/BattleRift.apk

      - name: Verify the APK manifest
        run: |
          AAPT2="$ANDROID_SDK_ROOT/build-tools/$ANDROID_BUILD_TOOLS/aapt2"
          test -x "$AAPT2" || { echo "aapt2 not found in build-tools $ANDROID_BUILD_TOOLS"; exit 1; }
          "$AAPT2" dump badging build/BattleRift.apk > badging.txt
          "$AAPT2" dump xmltree --file AndroidManifest.xml build/BattleRift.apk > manifest.txt
          grep -E "^package:|^sdkVersion:|^targetSdkVersion:|^native-code:" badging.txt
          FAILED=0
          grep -q "^sdkVersion:'$ANDROID_MIN_SDK'" badging.txt || { echo "::error::minSdkVersion is not $ANDROID_MIN_SDK"; FAILED=1; }
          grep -q "^targetSdkVersion:'$ANDROID_TARGET_SDK'" badging.txt || { echo "::error::targetSdkVersion is not $ANDROID_TARGET_SDK"; FAILED=1; }
          grep -q "compileSdkVersion='$ANDROID_COMPILE_SDK'" badging.txt || echo "::warning::compileSdkVersion $ANDROID_COMPILE_SDK was not found in the APK manifest"
          grep -E "enableOnBackInvokedCallback.*(=false|=\(type 0x12\)0x0)" manifest.txt > /dev/null || { echo "::error::android:enableOnBackInvokedCallback=false is missing from the APK manifest"; FAILED=1; }
          grep -q "PROPERTY_COMPAT_ALLOW_RESTRICTED_RESIZABILITY" manifest.txt || { echo "::error::PROPERTY_COMPAT_ALLOW_RESTRICTED_RESIZABILITY is missing from the APK manifest"; FAILED=1; }
          grep -q "^native-code:.*'arm64-v8a'" badging.txt || { echo "::error::the APK has no arm64-v8a native code"; FAILED=1; }
          exit "$FAILED"

      - name: Report native library page alignment
        run: |
          mkdir -p elf && unzip -q -o build/BattleRift.apk 'lib/arm64-v8a/*.so' -d elf
          for so in elf/lib/arm64-v8a/*.so; do
            ALIGN=$(readelf -lW "$so" | awk '/LOAD/{print $NF; exit}')
            echo "$(basename "$so"): LOAD alignment $ALIGN"
            if [ "$((ALIGN))" -lt 16384 ]; then
              echo "::warning::$(basename "$so") is aligned to $((ALIGN)) bytes, not 16 KB. It will not load on devices with 16 KB memory pages."
            fi
          done

      - name: Show the end of the export log
        if: failure()
        run: tail -n 120 export.log || true

      - name: Upload the export log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: export-log
          path: export.log
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v4
        with:
          name: battlerift-apk
          path: build/BattleRift.apk
          if-no-files-found: error