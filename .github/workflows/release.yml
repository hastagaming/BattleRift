name: Release APK

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Load the toolchain versions
        run: cat tools/android/toolchain.env >> "$GITHUB_ENV"

      - name: Validate the tag and derive the version
        id: version
        run: |
          python3 tools/android/version.py resolve "$TAG" --github-output "$GITHUB_OUTPUT"
          git tag --list 'v*' | python3 tools/android/version.py check-order "$TAG"

      - name: Write the version into export_presets.cfg (workspace only, no commit)
        run: python3 tools/android/version.py apply "$TAG" --preset export_presets.cfg

      - name: Check the configuration and the build scripts
        run: |
          python3 tools/android/check_config.py
          python3 -m unittest discover -s tools/android -p 'test_*.py' -v

      - uses: ./.github/actions/setup-android-export

      - name: Run logic tests
        run: |
          godot --headless --import || true
          godot --headless -s res://scripts/tests/logic_tests.gd

      - name: Export the release APK
        run: |
          set -o pipefail
          mkdir -p build
          godot --headless --verbose --export-release "Android" build/BattleRift.apk 2>&1 | tee export.log
          test -f build/BattleRift.apk

      - name: Verify the exported APK
        run: tools/android/verify_apk.sh build/BattleRift.apk --version-name "${{ steps.version.outputs.version_name }}" --version-code "${{ steps.version.outputs.version_code }}"

      - name: Sign the APK with the release key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          for name in KEYSTORE_BASE64 KS_PASS KEY_ALIAS KEY_PASS; do
            if [ -z "${!name}" ]; then
              echo "::error::The GitHub secret for $name is not set"
              exit 1
            fi
          done
          BT="$ANDROID_HOME/build-tools/$ANDROID_BUILD_TOOLS"
          trap 'rm -f "$RUNNER_TEMP/release.jks"' EXIT
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          mkdir -p dist
          "$BT/zipalign" -p -f 4 build/BattleRift.apk "$RUNNER_TEMP/aligned.apk"
          "$BT/apksigner" sign --ks "$RUNNER_TEMP/release.jks" --ks-key-alias "$KEY_ALIAS" --ks-pass env:KS_PASS --key-pass env:KEY_PASS --out "dist/BattleRift-${TAG}.apk" "$RUNNER_TEMP/aligned.apk"

      - name: Verify the signed APK
        run: |
          tools/android/verify_apk.sh "dist/BattleRift-${TAG}.apk" --signed --version-name "${{ steps.version.outputs.version_name }}" --version-code "${{ steps.version.outputs.version_code }}"
          (cd dist && sha256sum "BattleRift-${TAG}.apk" | tee "BattleRift-${TAG}.apk.sha256")

      - name: Show the end of the export log
        if: failure()
        run: tail -n 120 export.log || true

      - name: Upload the signed APK
        uses: actions/upload-artifact@v4
        with:
          name: battlerift-release
          path: dist/
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: battlerift-release
          path: dist

      - name: Publish the GitHub Release
        run: |
          gh release create "$TAG" "dist/BattleRift-${TAG}.apk" "dist/BattleRift-${TAG}.apk.sha256" \
            --repo "$GITHUB_REPOSITORY" --verify-tag --title "BattleRift $TAG" --generate-notes